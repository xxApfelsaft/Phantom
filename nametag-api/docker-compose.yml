version: '3.8'

services:
  nametag-api:
    build: .
    container_name: phantom-nametag-api
    networks:
      - npm-net
    restart: unless-stopped
    # If Nginx Proxy Manager is on the same network, you don't need to expose ports 
    # directly to the host machine. NPM will route traffic internally to port 3000.
    expose:
      - "3000"

networks:
  npm-net:
    external: true
